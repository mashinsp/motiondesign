<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sora Digital Product Engineering</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#00041F}*{box-sizing:border-box}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Poppins,sans-serif;color:#fff;
background:radial-gradient(900px 620px at 50% 78%,rgba(40,90,255,.55),transparent 70%),radial-gradient(700px 400px at 50% 0%,rgba(30,60,200,.35),transparent 70%),linear-gradient(180deg,#010948,#00041F 60%,#020a3a)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,150,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,255,.07) 1px,transparent 1px);background-size:54px 54px;mask-image:radial-gradient(circle at 50% 70%,#000 0,transparent 65%)}
.brand{position:absolute;left:72px;top:72px;display:flex;align-items:center;gap:14px}
.brand svg{width:23px;height:33px;display:block}.brand span{font-weight:500;font-size:22px;letter-spacing:.08em}
.copy{position:absolute;left:0;right:0;top:180px;text-align:center}
h1{margin:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:700;font-size:92px;line-height:1.02;letter-spacing:-.03em}
.accent{color:#9CC4FF}
.sub{margin:26px auto 0;width:760px;font-size:26px;line-height:1.45;color:rgba(255,255,255,.88)}.sub b{font-weight:600;color:#fff}
/* hero */
.hero{position:absolute;left:50%;top:528px;width:900px;height:520px;transform:translateX(-50%)}
.win{position:absolute;left:70px;top:20px;width:640px;height:420px;border-radius:22px;background:linear-gradient(160deg,rgba(40,60,150,.55),rgba(6,12,50,.8));border:1.5px solid rgba(140,170,255,.45);box-shadow:0 30px 80px rgba(0,10,60,.7),0 0 60px rgba(50,100,255,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.bar{height:46px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid rgba(140,170,255,.2)}
.bar i{width:11px;height:11px;border-radius:50%;background:rgba(255,255,255,.35)}
.bar b{margin-left:16px;flex:0 0 260px;height:20px;border-radius:10px;background:rgba(255,255,255,.08)}
.body{display:flex;gap:18px;padding:22px}
.side{width:130px;display:flex;flex-direction:column;gap:12px}.side i{height:14px;border-radius:7px;background:rgba(255,255,255,.12)}.side i:first-child{background:#2f63ff}
.main{flex:1;display:flex;flex-direction:column;gap:16px}
.kpis{display:flex;gap:14px}.kpi{flex:1;height:84px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(140,170,255,.18);padding:14px}
.kpi i{display:block;width:50%;height:10px;border-radius:5px;background:rgba(255,255,255,.2)}.kpi b{display:block;margin-top:14px;width:70%;height:20px;border-radius:6px;background:linear-gradient(90deg,#9CC4FF,#2f63ff)}
.chart{height:190px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(140,170,255,.18);display:flex;align-items:flex-end;gap:14px;padding:20px 22px}
.chart i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#6f9cff,rgba(47,99,255,.35))}
.phone{position:absolute;right:70px;top:110px;width:210px;height:380px;border-radius:34px;background:linear-gradient(160deg,rgba(50,75,180,.7),#07103f 60%);border:1.5px solid rgba(160,190,255,.55);box-shadow:0 30px 70px rgba(0,10,60,.8),0 0 50px rgba(60,110,255,.35),inset 0 1px 0 rgba(255,255,255,.2);padding:26px 18px}
.phone .notch{width:70px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);margin:0 auto 22px}
.phone .card{height:96px;border-radius:16px;background:linear-gradient(135deg,#2f63ff,#0a1d86);margin-bottom:14px;box-shadow:0 0 24px rgba(50,100,255,.5)}
.phone .ln{height:12px;border-radius:6px;background:rgba(255,255,255,.14);margin-bottom:12px}.phone .ln.s{width:60%}
.phone .btn{margin-top:22px;height:40px;border-radius:12px;background:#fff;opacity:.9}
/* process */
.steps{position:absolute;left:72px;right:72px;top:1086px;display:flex;align-items:center}
.step{display:flex;align-items:center;gap:12px;height:62px;padding:0 22px;border-radius:16px;border:1.5px solid rgba(120,150,255,.45);background:rgba(6,10,48,.6);box-shadow:inset 0 0 18px rgba(70,110,255,.12)}
.step svg{width:24px;height:24px}.step span{font-weight:500;font-size:21px}
.ar{flex:1;height:1.5px;background:linear-gradient(90deg,rgba(60,110,255,.2),#4a7dff,rgba(60,110,255,.2))}
.foot{position:absolute;left:72px;right:72px;bottom:64px;height:84px;border-radius:42px;background:rgba(255,255,255,.07);border:1.5px solid rgba(160,190,255,.3);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.social{display:flex;gap:20px}.social svg{width:26px;height:26px;display:block}
.url{font-weight:500;font-size:26px}
