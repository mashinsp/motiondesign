<!doctype html>
<html><head><meta charset="utf-8"><title>Agentic Systems</title>
<style>
@font-face{font-family:"Inter Tight";src:url(fonts/InterTight.woff2) format("woff2");font-weight:100 900;}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Italic.woff2) format("woff2");font-style:italic;}
@font-face{font-family:"Instrument Serif";src:url(fonts/InstrumentSerif-Regular.woff2) format("woff2");font-style:normal;}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script src="timeline.js"></script>
<script src="logo.js"></script>
<script>
(async () => {
  await Promise.all([
    document.fonts.load('300 64px "Inter Tight"'), document.fonts.load('400 64px "Inter Tight"'),
    document.fonts.load('italic 400 64px "Instrument Serif"'),
  ]);
  await document.fonts.ready;
  const s = document.createElement('script'); s.src = 'engine.js';
  s.onload = () => { window.READY = true; };
  document.body.appendChild(s);
})();
window.frameData = async (t, type = 'image/png') => {
  window.render(t);
  const c = document.getElementById('c');
  const blob = await new Promise((r) => c.toBlob(r, type));
  const buf = new Uint8Array(await blob.arrayBuffer());
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < buf.length; i += CH) s += String.fromCharCode.apply(null, buf.subarray(i, i + CH));
  return btoa(s);
};
</script></body></html>
